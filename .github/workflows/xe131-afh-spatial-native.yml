name: Seven-isotope native AFH v6.0 eight-response cross-check

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed LZ-3-body-for-hdm commit SHA"
        required: true
        type: string
        default: "5afc500a3102b857dd16e29432db8e6e068d65d1"
      p3_run_id:
        description: "LZ-3-body-for-hdm workflow run containing the P3-B spatial artifact"
        required: true
        type: string
        default: "44911789662"
      p3_artifact_id:
        description: "P3-B seven-isotope spatial-response artifact ID"
        required: true
        type: string
        default: "14709662510"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/xe131-afh-spatial-native.yml"

permissions:
  contents: read

concurrency:
  group: xe131-afh-spatial-native
  cancel-in-progress: true

jobs:
  native-afh-eight-response:
    runs-on: [self-hosted, Windows, X64, research-gpu]
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ github.event.inputs.source_sha || '5afc500a3102b857dd16e29432db8e6e068d65d1' }}
    steps:
      - name: Check out the private control repository
        uses: actions/checkout@v4

      - name: Check out the pinned LZ research revision
        uses: actions/checkout@v4
        with:
          repository: lm846802297-bit/LZ-3-body-for-hdm
          ref: ${{ github.event.inputs.source_sha || '5afc500a3102b857dd16e29432db8e6e068d65d1' }}
          token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          path: research
          persist-credentials: false

      - name: Verify pinned source and AFH inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -C "$env:GITHUB_WORKSPACE\research" rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Research source SHA mismatch: expected $env:SOURCE_SHA, got $actual"
          }
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $required = @(
            'run_afh_full_response_database.py',
            'validate_afh_full_response_database.py',
            'compare_native_afh_full_response.py',
            'run_afh_full_response_database.wls',
            'run_xe131_dense_charge_dip_native.wls',
            'validate_xe131_dense_charge_dip.py',
            'tests\test_validate_xe131_dense_charge_dip.py',
            'run_afh_spatial_multipoles_native.wls',
            'compare_p3_spatial_multipoles_native.py',
            'tests\test_compare_p3_spatial_multipoles_native.py',
            '..\afh_default_density_xe131\run_afh_spatial_response_audit.py',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe128_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe129_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe130_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe131_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe132_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe134_density_matrix.csv',
            '..\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe136_density_matrix.csv'
          )
          foreach ($relative in $required) {
            $candidate = Join-Path $study $relative
            if (-not (Test-Path $candidate -PathType Leaf)) {
              throw "Required pinned research input is missing: $candidate"
            }
          }
          Write-Host "Verified pinned research source $actual"

      - name: Verify Wolfram and prepare isolated Python environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wolfram = Get-Command wolframscript -ErrorAction Stop
          $wolframVersion = & $wolfram.Source -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'wolframscript -version failed.' }
          $python = Get-Command python -ErrorAction Stop
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          & $python.Source -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated Python environment.' }
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $pythonExe -m pip install numpy scipy sympy
          if ($LASTEXITCODE -ne 0) { throw 'Numerical dependencies could not be installed.' }
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @($wolframVersion) | Set-Content -Path (Join-Path $out 'wolfram-version.txt') -Encoding UTF8
          & $pythonExe --version 2>&1 | Set-Content -Path (Join-Path $out 'python-version.txt') -Encoding UTF8

      - name: Run native AFH v6.0 ResponseNuclear indices 1 through 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $nativeDir = Join-Path $out 'native'
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          $env:AFH_FULL_RESPONSE_OUTDIR = $nativeDir
          $env:DMFormFactorPath = Join-Path $env:GITHUB_WORKSPACE 'research\v6\dmformfactor-V6.m'
          $transcript = Join-Path $out 'native-wolfram-transcript.txt'
          Start-Transcript -Path $transcript -Force
          try {
            & wolframscript -file (Join-Path $study 'run_afh_full_response_database.wls')
            if ($LASTEXITCODE -ne 0) { throw "Native AFH Wolfram exporter exited with code $LASTEXITCODE." }
            foreach ($isotope in @(128,129,130,131,132,134,136)) {
              $nativeCsv = Join-Path $nativeDir ("afh_v6_xe{0}_eight_response_native.csv" -f $isotope)
              if (-not (Test-Path $nativeCsv -PathType Leaf)) { throw "Missing native output: $nativeCsv" }
            }
            if (-not (Test-Path (Join-Path $nativeDir 'native_metadata.txt') -PathType Leaf)) {
              throw 'Missing native AFH metadata.'
            }
          }
          finally {
            Stop-Transcript
          }


      - name: Export dense native Xe-131 charge responses around the W_M diffraction minimum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $denseDir = Join-Path $out 'native-dense-charge-dip'
          New-Item -ItemType Directory -Force -Path $denseDir | Out-Null
          $env:DMFormFactorPath = Join-Path $env:GITHUB_WORKSPACE 'research\v6\dmformfactor-V6.m'
          $env:AFH_SOURCE_COMMIT = $env:SOURCE_SHA
          $env:AFH_XE131_DENSE_CHARGE_OUTDIR = $denseDir
          & wolframscript -file (Join-Path $study 'run_xe131_dense_charge_dip_native.wls')
          if ($LASTEXITCODE -ne 0) { throw 'Dense native Xe-131 charge-response export failed.' }
          $denseCsv = Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv'
          $denseMeta = Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt'
          if (-not (Test-Path $denseCsv -PathType Leaf)) { throw 'Dense Xe-131 charge CSV is missing.' }
          if (-not (Test-Path $denseMeta -PathType Leaf)) { throw 'Dense Xe-131 charge metadata is missing.' }
          $denseRows = @(Import-Csv $denseCsv)
          if ($denseRows.Count -ne 121) { throw "Expected 121 dense q rows, got $($denseRows.Count)." }

      - name: Validate dense native Xe-131 charge grid against coarse native overlap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $denseDir = Join-Path $out 'native-dense-charge-dip'
          & $pythonExe -m py_compile (Join-Path $study 'validate_xe131_dense_charge_dip.py') (Join-Path $study 'tests\test_validate_xe131_dense_charge_dip.py')
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 charge validator compilation failed.' }
          & $pythonExe -m unittest discover -s (Join-Path $study 'tests') -p 'test_validate_xe131_dense_charge_dip.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 charge validator unit tests failed.' }
          & $pythonExe (Join-Path $study 'validate_xe131_dense_charge_dip.py') --dense-csv (Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv') --dense-metadata (Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt') --coarse-csv (Join-Path $out 'native\afh_v6_xe131_eight_response_native.csv') --out-json (Join-Path $denseDir 'validation.json')
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 native/coarse overlap validation failed.' }

      - name: Run native AFH Delta and SigmaPrime rank-resolved multipoles
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $spatialOut = Join-Path $out 'native-spatial-multipoles'
          New-Item -ItemType Directory -Force -Path $spatialOut | Out-Null
          $env:AFH_SPATIAL_NATIVE_OUTDIR = $spatialOut
          $env:AFH_SOURCE_COMMIT = $env:SOURCE_SHA
          & wolframscript -file (Join-Path $study 'run_afh_spatial_multipoles_native.wls')
          if ($LASTEXITCODE -ne 0) { throw 'Native AFH spatial multipole export failed.' }
          $nativeCsv = Join-Path $spatialOut 'afh_v6_xe129_xe131_spatial_multipoles_native.csv'
          $nativeMetadata = Join-Path $spatialOut 'native_spatial_multipole_metadata.txt'
          if (-not (Test-Path $nativeCsv -PathType Leaf)) { throw 'Native spatial multipole CSV is missing.' }
          if (-not (Test-Path $nativeMetadata -PathType Leaf)) { throw 'Native spatial multipole metadata is missing.' }
          $nativeRows = @(Import-Csv $nativeCsv)
          if ($nativeRows.Count -ne 9604) { throw "Expected 9,604 native multipole rows, got $($nativeRows.Count)." }
          $nativeMeta = Get-Content -Raw $nativeMetadata
          if ($nativeMeta -notmatch 'AFH_source_sha256=dc0742f1c50b0a478adab62f2ddef6c82978ee034c1f177e0ed917deab5dd372') {
            throw 'Native multipole AFH source SHA-256 does not match the reviewed v6.0 source.'
          }
          if ($nativeMeta -notmatch 'rank_map=129=1;131=1,2,3') {
            throw 'Native Xe-129/Xe-131 rank map does not match the expected OBDME multipoles.'
          }
          $imagLine = ($nativeMeta -split "`n" | Where-Object { $_ -like 'max_imaginary_residual=*' } | Select-Object -First 1)
          $imagResidual = [double]($imagLine -replace '^max_imaginary_residual=', '')
          if ($imagResidual -gt 2e-12) { throw "Native multipole imaginary residual too large: $imagResidual" }

      - name: Run full seven-isotope Python database and internal validator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $pythonDir = Join-Path $out 'python'
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          & $pythonExe (Join-Path $study 'run_afh_full_response_database.py') --outdir $pythonDir
          if ($LASTEXITCODE -ne 0) { throw 'Seven-isotope Python AFH database generation failed.' }
          & $pythonExe (Join-Path $study 'validate_afh_full_response_database.py') --csv (Join-Path $pythonDir 'afh_v6_full_eight_response_7isotope.csv') --out-json (Join-Path $pythonDir 'validation.json')
          if ($LASTEXITCODE -ne 0) { throw 'Python AFH database internal validation failed.' }

      - name: Compare all 16,807 rows and eight responses with native AFH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $comparisonPath = Join-Path $out 'native-comparison.json'
          & $pythonExe (Join-Path $study 'compare_native_afh_full_response.py') --python-csv (Join-Path $out 'python\afh_v6_full_eight_response_7isotope.csv') --native-dir (Join-Path $out 'native') --out-json $comparisonPath --rtol 5e-7 --atol 2e-12 --imag-atol 2e-12
          if ($LASTEXITCODE -ne 0) { throw 'Pointwise native AFH comparison failed.' }
          $comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
          if ($comparison.status -ne 'PASS' -or $comparison.native_afh_validated -ne $true -or $comparison.rows_compared -ne 16807) {
            throw "Expected native PASS for 16,807 rows; status=$($comparison.status), rows=$($comparison.rows_compared)."
          }

      - name: Write provenance manifest
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          if (Test-Path $out) {
            $comparisonPath = Join-Path $out 'native-comparison.json'
            $comparison = $null
            if (Test-Path $comparisonPath) {
              $comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
            }
            $wolframVersionValue = $null
            $pythonVersionValue = $null
            if (Test-Path (Join-Path $out 'wolfram-version.txt')) {
              $wolframVersionValue = (Get-Content -Raw (Join-Path $out 'wolfram-version.txt')).Trim()
            }
            if (Test-Path (Join-Path $out 'python-version.txt')) {
              $pythonVersionValue = (Get-Content -Raw (Join-Path $out 'python-version.txt')).Trim()
            }
            $denseDir = Join-Path $out 'native-dense-charge-dip'
            $denseCsv = Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv'
            $denseMeta = Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt'
            $denseValidationPath = Join-Path $denseDir 'validation.json'
            $denseCsvHash = $null
            $denseMetaHash = $null
            $denseValidationHash = $null
            $denseRows = $null
            $denseValidation = $null
            if (Test-Path $denseCsv) {
              $denseCsvHash = (Get-FileHash $denseCsv -Algorithm SHA256).Hash.ToLower()
              $denseRows = @(Import-Csv $denseCsv).Count
            }
            if (Test-Path $denseMeta) {
              $denseMetaHash = (Get-FileHash $denseMeta -Algorithm SHA256).Hash.ToLower()
            }
            if (Test-Path $denseValidationPath) {
              $denseValidationHash = (Get-FileHash $denseValidationPath -Algorithm SHA256).Hash.ToLower()
              $denseValidation = Get-Content -Raw $denseValidationPath | ConvertFrom-Json
            }
            $spatialDir = Join-Path $out 'native-spatial-multipoles'
            $spatialCsv = Join-Path $spatialDir 'afh_v6_xe129_xe131_spatial_multipoles_native.csv'
            $spatialMeta = Join-Path $spatialDir 'native_spatial_multipole_metadata.txt'
            $spatialCsvHash = $null
            $spatialMetaHash = $null
            $spatialRows = $null
            $spatialImaginaryResidual = $null
            $spatialRankMap = $null
            if (Test-Path $spatialCsv) {
              $spatialCsvHash = (Get-FileHash $spatialCsv -Algorithm SHA256).Hash.ToLower()
              $spatialRows = @(Import-Csv $spatialCsv).Count
            }
            if (Test-Path $spatialMeta) {
              $spatialMetaHash = (Get-FileHash $spatialMeta -Algorithm SHA256).Hash.ToLower()
              $spatialText = Get-Content -Raw $spatialMeta
              $imagLine = ($spatialText -split "`n" | Where-Object { $_ -like 'max_imaginary_residual=*' } | Select-Object -First 1)
              if ($imagLine) { $spatialImaginaryResidual = [double]($imagLine -replace '^max_imaginary_residual=', '') }
              $rankLine = ($spatialText -split "`n" | Where-Object { $_ -like 'rank_map=*' } | Select-Object -First 1)
              if ($rankLine) { $spatialRankMap = $rankLine -replace '^rank_map=', '' }
            }
            $manifest = [ordered]@{
              repository = 'lm846802297-bit/LZ-3-body-for-hdm'
              source_commit = $env:SOURCE_SHA
              control_run_id = $env:GITHUB_RUN_ID
              control_run_attempt = $env:GITHUB_RUN_ATTEMPT
              native_package = 'AFH DMFormFactor v6.0'
              wolfram_version = $wolframVersionValue
              python_version = $pythonVersionValue
              isotopes = @(128,129,130,131,132,134,136)
              response_indices = [ordered]@{ M=1; SigmaDoublePrime=2; SigmaPrime=3; PhiPP=4; PhiTildePrime=5; Delta=6; MPhiPP=7; SigmaPrimeDelta=8 }
              q_grid = [ordered]@{ points=2401; q_min_GeV=0.0; q_max_GeV=0.6; step_GeV=0.00025 }
              convention = 'raw AFH isoscalar tau1=tau2=0; physical equal-p/n factor four applied only to converted columns'
              comparison = $comparison
              native_xe131_dense_charge_dip = [ordered]@{
                csv_sha256 = $denseCsvHash
                metadata_sha256 = $denseMetaHash
                validation_sha256 = $denseValidationHash
                rows = $denseRows
                validation_status = if ($denseValidation) { $denseValidation.status } else { $null }
                q_min_GeV = 0.2545
                q_max_GeV = 0.2575
                q_step_GeV = 0.000025
                response_indices = [ordered]@{ M=1; PhiPP=4; MPhiPP=7 }
                common_coarse_nodes_compared = if ($denseValidation) { $denseValidation.common_nodes_compared } else { $null }
              }
              native_spatial_multipoles = [ordered]@{
                csv_sha256 = $spatialCsvHash
                metadata_sha256 = $spatialMetaHash
                rows = $spatialRows
                max_imaginary_residual = $spatialImaginaryResidual
                rank_map = $spatialRankMap
                isotope_set = @(129,131)
                channels = @('DeltaJ','SigmaPJ')
              }
              scope = 'native AFH total-response and rank-resolved spatial-multipole pointwise export; no finite-t nucleon form factors and no three-body L_mu_nu W_A_mu_nu contraction'
            }
            $manifest | ConvertTo-Json -Depth 16 | Set-Content -Path (Join-Path $out 'run_manifest.json') -Encoding UTF8
          }

      - name: Download the P3-B spatial response and rank-resolved multipole artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ github.event.inputs.p3_artifact_id || '14709662510' }}
          github-token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          repository: lm846802297-bit/LZ-3-body-for-hdm
          run-id: ${{ github.event.inputs.p3_run_id || '44911789662' }}
          path: ${{ runner.temp }}/afh-eight-response/p3-spatial

      - name: Compile and test native P3 multipole comparator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe -m py_compile (Join-Path $study 'compare_p3_spatial_multipoles_native.py') (Join-Path $study 'tests\test_compare_p3_spatial_multipoles_native.py')
          if ($LASTEXITCODE -ne 0) { throw 'Native P3 multipole comparator compilation failed.' }
          & $pythonExe -m unittest discover -s (Join-Path $study 'tests') -p 'test_compare_p3_spatial_multipoles_native.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native P3 multipole comparator unit tests failed.' }

      - name: Compare P3-B total responses and rank-resolved amplitudes with native AFH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $p3Dir = Join-Path $out 'p3-spatial'
          $nativeDir = Join-Path $out 'native'
          $nativeSpatialDir = Join-Path $out 'native-spatial-multipoles'
          $manifestPath = Join-Path $out 'run_manifest.json'
          $resultPath = Join-Path $out 'p3-native-spatial-comparison.json'
          & $pythonExe (Join-Path $study 'compare_p3_spatial_multipoles_native.py') --p3-dir $p3Dir --native-dir $nativeDir --native-spatial-dir $nativeSpatialDir --native-manifest $manifestPath --expected-source-commit $env:SOURCE_SHA --out-json $resultPath
          if ($LASTEXITCODE -ne 0) { throw 'P3-B native AFH total-response/rankwise multipole comparison failed.' }

      - name: Attach P3 spatial comparison to provenance manifest
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $manifestPath = Join-Path $out 'run_manifest.json'
          $comparisonPath = Join-Path $out 'p3-native-spatial-comparison.json'
          if ((Test-Path $manifestPath) -and (Test-Path $comparisonPath)) {
            $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
            $p3Comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
            $manifest | Add-Member -NotePropertyName p3_spatial_multipole_crosscheck -NotePropertyValue $p3Comparison -Force
            $manifest | Add-Member -NotePropertyName p3_artifact_provenance -NotePropertyValue ([ordered]@{
              repository = 'lm846802297-bit/LZ-3-body-for-hdm'
              run_id = '${{ github.event.inputs.p3_run_id || '44911789662' }}'
              artifact_id = '${{ github.event.inputs.p3_artifact_id || '14709662510' }}'
            }) -Force
            $manifest | ConvertTo-Json -Depth 32 | Set-Content -Path $manifestPath -Encoding UTF8
          }

      - name: Hash native, Python and comparison outputs
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          if (Test-Path $out) {
            $hashes = Get-ChildItem $out -File -Recurse |
              Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($out.Length + 1)
                $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                "$hash  $relative"
              }
            $hashes | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII
          }

      - name: Upload seven-isotope AFH eight-response archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afh-v6-seven-isotope-eight-response
          path: ${{ runner.temp }}/afh-eight-response/
          if-no-files-found: warn
          retention-days: 90
