name: Seven-isotope native AFH v6.0 eight-response cross-check

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed commit containing the native AFH v6.0 Wolfram exporters"
        required: true
        type: string
        default: "aa493b2b76727da2fd51609fe87c647910f7e456"
      p3_source_sha:
        description: "Exact reviewed LZ commit containing the P3 comparators and dense-grid exporter"
        required: true
        type: string
        default: "61d7391aae3028276b0846802c19f2404a8a59f4"
      p3_run_id:
        description: "LZ-3-body-for-hdm workflow run containing the P3-B spatial artifact"
        required: true
        type: string
        default: "44950264673"
      p3_artifact_id:
        description: "P3-B seven-isotope spatial-response artifact ID"
        required: true
        type: string
        default: "14724884350"

permissions:
  contents: read

concurrency:
  group: xe131-afh-spatial-native
  cancel-in-progress: true

jobs:
  native-afh-eight-response:
    runs-on: [self-hosted, Windows, X64, research-gpu]
    timeout-minutes: 180
    env:
      NATIVE_SOURCE_SHA: ${{ github.event.inputs.source_sha || 'aa493b2b76727da2fd51609fe87c647910f7e456' }}
      P3_SOURCE_SHA: ${{ github.event.inputs.p3_source_sha || '61d7391aae3028276b0846802c19f2404a8a59f4' }}
    steps:
      - name: Check out the private control repository
        uses: actions/checkout@v4

      - name: Check out the pinned native AFH exporter revision
        uses: actions/checkout@v4
        with:
          repository: lm846802297-bit/LZ-3-body-for-hdm
          ref: ${{ github.event.inputs.source_sha || 'aa493b2b76727da2fd51609fe87c647910f7e456' }}
          token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          path: native-source
          persist-credentials: false

      - name: Check out the pinned P3 comparator and dense-grid revision
        uses: actions/checkout@v4
        with:
          repository: lm846802297-bit/LZ-3-body-for-hdm
          ref: ${{ github.event.inputs.p3_source_sha || '61d7391aae3028276b0846802c19f2404a8a59f4' }}
          token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          path: p3-source
          persist-credentials: false

      - name: Verify both pinned source revisions and AFH inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE 'native-source'
          $p3Root = Join-Path $env:GITHUB_WORKSPACE 'p3-source'
          $actualNative = (git -C $nativeRoot rev-parse HEAD).Trim()
          $actualP3 = (git -C $p3Root rev-parse HEAD).Trim()
          if ($actualNative -ne $env:NATIVE_SOURCE_SHA) {
            throw "Native AFH source SHA mismatch: expected $env:NATIVE_SOURCE_SHA, got $actualNative"
          }
          if ($actualP3 -ne $env:P3_SOURCE_SHA) {
            throw "P3 source SHA mismatch: expected $env:P3_SOURCE_SHA, got $actualP3"
          }

          $nativeStudy = Join-Path $nativeRoot 'research\afh_full_response_database'
          $p3Study = Join-Path $p3Root 'research\afh_full_response_database'
          $p3Crosscheck = Join-Path $p3Root 'research\afh_response_crosschecks'
          $p3MatchStudy = Join-Path $p3Root 'research\three_body_full_current_nucleon_match'
          $nativeRequired = @(
            (Join-Path $nativeStudy 'run_afh_full_response_database.py'),
            (Join-Path $nativeStudy 'validate_afh_full_response_database.py'),
            (Join-Path $nativeStudy 'compare_native_afh_full_response.py'),
            (Join-Path $nativeStudy 'run_afh_full_response_database.wls'),
            (Join-Path $nativeStudy 'run_afh_spatial_multipoles_native.wls'),
            (Join-Path $nativeStudy 'tests\test_afh_full_response_database.py'),
            (Join-Path $nativeRoot 'research\afh_default_density_xe131\run_afh_spatial_response_audit.py'),
            (Join-Path $nativeRoot 'research\afh_default_density_xe131\output\phi_response_native\afh_default_xe131_M_PhiPP_native.csv'),
            (Join-Path $nativeRoot 'v6\dmformfactor-V6.m')
          )
          foreach ($A in @(128,129,130,131,132,134,136)) {
            $nativeRequired += Join-Path $nativeRoot ("research\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
          }
          $p3Required = @(
            (Join-Path $p3Study 'run_xe131_dense_charge_dip_native.wls'),
            (Join-Path $p3Root 'research\afh_default_density_xe131\run_afh_default_xe131.py'),
            (Join-Path $p3Study 'validate_xe131_dense_charge_dip.py'),
            (Join-Path $p3Study 'tests\test_validate_xe131_dense_charge_dip.py'),
            (Join-Path $p3Root 'research\afh_default_density_xe131\run_afh_default_xe131.py'),
            (Join-Path $p3Crosscheck 'compare_p3_spatial_vs_native.py'),
            (Join-Path $p3Crosscheck 'compare_p3_multipoles_vs_native.py'),
            (Join-Path $p3MatchStudy 'test_afh_native_multipole_comparator.py'),
            (Join-Path $p3MatchStudy 'afh_spatial_obdme_responses.py'),
            (Join-Path $p3MatchStudy 'validate_afh_spatial_multipole_archive.py'),
            (Join-Path $p3Root 'v6\dmformfactor-V6.m')
          )
          foreach ($A in @(128,129,130,131,132,134,136)) {
            $p3Required += Join-Path $p3Root ("research\afh_default_density_natural_xenon_halo\results\full_afh_v6_default_7_isotope_response\density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
          }
          foreach ($candidate in $nativeRequired + $p3Required) {
            if (-not (Test-Path $candidate -PathType Leaf)) {
              throw "Required pinned research input is missing: $candidate"
            }
          }
          $afhHash = (Get-FileHash (Join-Path $nativeRoot 'v6\dmformfactor-V6.m') -Algorithm SHA256).Hash.ToLower()
          if ($afhHash -ne 'dc0742f1c50b0a478adab62f2ddef6c82978ee034c1f177e0ed917deab5dd372') {
            throw "AFH v6.0 package hash mismatch: $afhHash"
          }
          Write-Host "Verified native exporter source $actualNative"
          Write-Host "Verified P3 comparator source $actualP3"
          Write-Host "Verified AFH v6.0 source SHA-256 $afhHash"

      - name: Verify Wolfram and prepare isolated Python environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wolfram = Get-Command wolframscript -ErrorAction Stop
          $wolframVersion = & $wolfram.Source -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'wolframscript -version failed.' }
          $python = Get-Command python -ErrorAction Stop
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          & $python.Source -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated Python environment.' }
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $pythonExe -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
          if ($LASTEXITCODE -ne 0) { throw 'Numerical dependencies could not be installed.' }
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @($wolframVersion) | Set-Content -Path (Join-Path $out 'wolfram-version.txt') -Encoding UTF8
          & $pythonExe --version 2>&1 | Set-Content -Path (Join-Path $out 'python-version.txt') -Encoding UTF8

      - name: Run native AFH v6.0 ResponseNuclear indices 1 through 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'native-source\research\afh_full_response_database'
          $nativeDir = Join-Path $out 'native'
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          $env:AFH_FULL_RESPONSE_OUTDIR = $nativeDir
          $env:DMFormFactorPath = Join-Path $env:GITHUB_WORKSPACE 'native-source\v6\dmformfactor-V6.m'
          $transcript = Join-Path $out 'native-wolfram-transcript.txt'
          Start-Transcript -Path $transcript -Force
          try {
            & wolframscript -file (Join-Path $study 'run_afh_full_response_database.wls')
            if ($LASTEXITCODE -ne 0) { throw "Native AFH Wolfram exporter exited with code $LASTEXITCODE." }
            foreach ($isotope in @(128,129,130,131,132,134,136)) {
              $nativeCsv = Join-Path $nativeDir ("afh_v6_xe{0}_eight_response_native.csv" -f $isotope)
              if (-not (Test-Path $nativeCsv -PathType Leaf)) { throw "Missing native output: $nativeCsv" }
            }
            if (-not (Test-Path (Join-Path $nativeDir 'native_metadata.txt') -PathType Leaf)) {
              throw 'Missing native AFH metadata.'
            }
          }
          finally {
            Stop-Transcript
          }


      - name: Export dense native Xe-131 charge responses around the W_M diffraction minimum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\afh_full_response_database'
          $denseDir = Join-Path $out 'native-dense-charge-dip'
          New-Item -ItemType Directory -Force -Path $denseDir | Out-Null
          $env:DMFormFactorPath = Join-Path $env:GITHUB_WORKSPACE 'native-source\v6\dmformfactor-V6.m'
          $env:AFH_SOURCE_COMMIT = $env:NATIVE_SOURCE_SHA
          $env:AFH_XE131_DENSE_CHARGE_OUTDIR = $denseDir
          & wolframscript -file (Join-Path $study 'run_xe131_dense_charge_dip_native.wls')
          if ($LASTEXITCODE -ne 0) { throw 'Dense native Xe-131 charge-response export failed.' }
          $denseCsv = Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv'
          $denseMeta = Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt'
          if (-not (Test-Path $denseCsv -PathType Leaf)) { throw 'Dense Xe-131 charge CSV is missing.' }
          if (-not (Test-Path $denseMeta -PathType Leaf)) { throw 'Dense Xe-131 charge metadata is missing.' }
          $denseRows = @(Import-Csv $denseCsv)
          if ($denseRows.Count -ne 121) { throw "Expected 121 dense q rows, got $($denseRows.Count)." }

      - name: Validate dense native Xe-131 charge grid against coarse native overlap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $denseDir = Join-Path $out 'native-dense-charge-dip'
          & $pythonExe -m py_compile (Join-Path $study 'validate_xe131_dense_charge_dip.py') (Join-Path $study 'tests\test_validate_xe131_dense_charge_dip.py')
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 charge validator compilation failed.' }
          & $pythonExe -m unittest discover -s (Join-Path $study 'tests') -p 'test_validate_xe131_dense_charge_dip.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 charge validator unit tests failed.' }
          & $pythonExe (Join-Path $study 'validate_xe131_dense_charge_dip.py') --dense-csv (Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv') --dense-metadata (Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt') --coarse-csv (Join-Path $out 'native\afh_v6_xe131_eight_response_native.csv') --out-json (Join-Path $denseDir 'validation.json')
          if ($LASTEXITCODE -ne 0) { throw 'Dense Xe-131 native/coarse overlap validation failed.' }

      - name: Run native AFH Delta and SigmaPrime rank-resolved multipoles
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $study = Join-Path $env:GITHUB_WORKSPACE 'native-source\research\afh_full_response_database'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $spatialOut = Join-Path $out 'native-spatial-multipoles'
          New-Item -ItemType Directory -Force -Path $spatialOut | Out-Null
          $env:AFH_SPATIAL_NATIVE_OUTDIR = $spatialOut
          $env:AFH_SOURCE_COMMIT = $env:NATIVE_SOURCE_SHA
          & wolframscript -file (Join-Path $study 'run_afh_spatial_multipoles_native.wls')
          if ($LASTEXITCODE -ne 0) { throw 'Native AFH spatial multipole export failed.' }
          $nativeCsv = Join-Path $spatialOut 'afh_v6_xe129_xe131_spatial_multipoles_native.csv'
          $nativeMetadata = Join-Path $spatialOut 'native_spatial_multipole_metadata.txt'
          if (-not (Test-Path $nativeCsv -PathType Leaf)) { throw 'Native spatial multipole CSV is missing.' }
          if (-not (Test-Path $nativeMetadata -PathType Leaf)) { throw 'Native spatial multipole metadata is missing.' }
          $nativeRows = @(Import-Csv $nativeCsv)
          if ($nativeRows.Count -ne 9604) { throw "Expected 9,604 native multipole rows, got $($nativeRows.Count)." }
          $nativeMeta = Get-Content -Raw $nativeMetadata
          if ($nativeMeta -notmatch 'AFH_source_sha256=dc0742f1c50b0a478adab62f2ddef6c82978ee034c1f177e0ed917deab5dd372') {
            throw 'Native multipole AFH source SHA-256 does not match the reviewed v6.0 source.'
          }
          if ($nativeMeta -notmatch 'rank_map=129=1;131=1,2,3') {
            throw 'Native Xe-129/Xe-131 rank map does not match the expected OBDME multipoles.'
          }
          $imagLine = ($nativeMeta -split "`n" | Where-Object { $_ -like 'max_imaginary_residual=*' } | Select-Object -First 1)
          $imagResidual = [double]($imagLine -replace '^max_imaginary_residual=', '')
          if ($imagResidual -gt 2e-12) { throw "Native multipole imaginary residual too large: $imagResidual" }

      - name: Run full seven-isotope Python database and internal validator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'native-source\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $pythonDir = Join-Path $out 'python'
          New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
          & $pythonExe -m py_compile (Join-Path $study 'run_afh_full_response_database.py') (Join-Path $study 'validate_afh_full_response_database.py') (Join-Path $study 'compare_native_afh_full_response.py') (Join-Path $study 'tests\test_afh_full_response_database.py')
          if ($LASTEXITCODE -ne 0) { throw 'Seven-isotope AFH Python source compilation failed.' }
          & $pythonExe -m unittest discover -s (Join-Path $study 'tests') -p 'test_afh_full_response_database.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Seven-isotope AFH Python regression tests failed.' }
          & $pythonExe (Join-Path $study 'run_afh_full_response_database.py') --outdir $pythonDir
          if ($LASTEXITCODE -ne 0) { throw 'Seven-isotope Python AFH database generation failed.' }
          & $pythonExe (Join-Path $study 'validate_afh_full_response_database.py') --csv (Join-Path $pythonDir 'afh_v6_full_eight_response_7isotope.csv') --out-json (Join-Path $pythonDir 'validation.json')
          if ($LASTEXITCODE -ne 0) { throw 'Python AFH database internal validation failed.' }

      - name: Compare all 16,807 rows and eight responses with native AFH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $study = Join-Path $env:GITHUB_WORKSPACE 'native-source\research\afh_full_response_database'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $comparisonPath = Join-Path $out 'native-comparison.json'
          & $pythonExe (Join-Path $study 'compare_native_afh_full_response.py') --python-csv (Join-Path $out 'python\afh_v6_full_eight_response_7isotope.csv') --native-dir (Join-Path $out 'native') --out-json $comparisonPath --rtol 5e-7 --atol 2e-12 --imag-atol 2e-12
          if ($LASTEXITCODE -ne 0) { throw 'Pointwise native AFH comparison failed.' }
          $comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
          if ($comparison.status -ne 'PASS' -or $comparison.native_afh_validated -ne $true -or $comparison.rows_compared -ne 16807) {
            throw "Expected native PASS for 16,807 rows; status=$($comparison.status), rows=$($comparison.rows_compared)."
          }

      - name: Write runtime, hardware, source, and native-output provenance
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          if (Test-Path $out) {
            $nativeRoot = Join-Path $env:GITHUB_WORKSPACE 'native-source'
            $p3Root = Join-Path $env:GITHUB_WORKSPACE 'p3-source'
            $nativeStudy = Join-Path $nativeRoot 'research\afh_full_response_database'
            $p3Study = Join-Path $p3Root 'research\afh_full_response_database'
            $p3Crosscheck = Join-Path $p3Root 'research\afh_response_crosschecks'
            $comparisonPath = Join-Path $out 'native-comparison.json'
            $comparison = $null
            if (Test-Path $comparisonPath) {
              $comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
            }
            $wolframVersionValue = $null
            $pythonVersionValue = $null
            if (Test-Path (Join-Path $out 'wolfram-version.txt')) {
              $wolframVersionValue = (Get-Content -Raw (Join-Path $out 'wolfram-version.txt')).Trim()
            }
            if (Test-Path (Join-Path $out 'python-version.txt')) {
              $pythonVersionValue = (Get-Content -Raw (Join-Path $out 'python-version.txt')).Trim()
            }

            $denseDir = Join-Path $out 'native-dense-charge-dip'
            $denseCsv = Join-Path $denseDir 'xe131_dense_charge_response_dip_native.csv'
            $denseMeta = Join-Path $denseDir 'xe131_dense_charge_response_dip_metadata.txt'
            $denseValidationPath = Join-Path $denseDir 'validation.json'
            $denseCsvHash = $null
            $denseMetaHash = $null
            $denseValidationHash = $null
            $denseRows = $null
            $denseValidation = $null
            if (Test-Path $denseCsv) {
              $denseCsvHash = (Get-FileHash $denseCsv -Algorithm SHA256).Hash.ToLower()
              $denseRows = @(Import-Csv $denseCsv).Count
            }
            if (Test-Path $denseMeta) {
              $denseMetaHash = (Get-FileHash $denseMeta -Algorithm SHA256).Hash.ToLower()
            }
            if (Test-Path $denseValidationPath) {
              $denseValidationHash = (Get-FileHash $denseValidationPath -Algorithm SHA256).Hash.ToLower()
              $denseValidation = Get-Content -Raw $denseValidationPath | ConvertFrom-Json
            }

            $spatialDir = Join-Path $out 'native-spatial-multipoles'
            $spatialCsv = Join-Path $spatialDir 'afh_v6_xe129_xe131_spatial_multipoles_native.csv'
            $spatialMeta = Join-Path $spatialDir 'native_spatial_multipole_metadata.txt'
            $spatialCsvHash = $null
            $spatialMetaHash = $null
            $spatialRows = $null
            $spatialImaginaryResidual = $null
            $spatialRankMap = $null
            if (Test-Path $spatialCsv) {
              $spatialCsvHash = (Get-FileHash $spatialCsv -Algorithm SHA256).Hash.ToLower()
              $spatialRows = @(Import-Csv $spatialCsv).Count
            }
            if (Test-Path $spatialMeta) {
              $spatialMetaHash = (Get-FileHash $spatialMeta -Algorithm SHA256).Hash.ToLower()
              $spatialText = Get-Content -Raw $spatialMeta
              $imagLine = ($spatialText -split '\r?\n' | Where-Object { $_ -like 'max_imaginary_residual=*' } | Select-Object -First 1)
              if ($imagLine) { $spatialImaginaryResidual = [double]($imagLine -replace '^max_imaginary_residual=', '') }
              $rankLine = ($spatialText -split '\r?\n' | Where-Object { $_ -like 'rank_map=*' } | Select-Object -First 1)
              if ($rankLine) { $spatialRankMap = $rankLine -replace '^rank_map=', '' }
            }

            $sourceFiles = @(
              (Join-Path $nativeStudy 'run_afh_full_response_database.py'),
              (Join-Path $nativeStudy 'validate_afh_full_response_database.py'),
              (Join-Path $nativeStudy 'compare_native_afh_full_response.py'),
              (Join-Path $nativeStudy 'run_afh_full_response_database.wls'),
              (Join-Path $nativeStudy 'run_afh_spatial_multipoles_native.wls'),
              (Join-Path $nativeStudy 'tests\test_afh_full_response_database.py'),
              (Join-Path $nativeRoot 'research\afh_default_density_xe131\run_afh_spatial_response_audit.py'),
              (Join-Path $p3Root 'research\afh_default_density_xe131\run_afh_default_xe131.py'),
              (Join-Path $p3Study 'run_xe131_dense_charge_dip_native.wls'),
              (Join-Path $p3Study 'validate_xe131_dense_charge_dip.py'),
              (Join-Path $p3Study 'tests\test_validate_xe131_dense_charge_dip.py'),
              (Join-Path $p3Crosscheck 'compare_p3_spatial_vs_native.py'),
              (Join-Path $p3Crosscheck 'compare_p3_multipoles_vs_native.py'),
              (Join-Path $p3Root 'research\three_body_full_current_nucleon_match\test_afh_native_multipole_comparator.py'),
              (Join-Path $p3Root 'research\three_body_full_current_nucleon_match\afh_spatial_obdme_responses.py'),
              (Join-Path $p3Root 'research\three_body_full_current_nucleon_match\validate_afh_spatial_multipole_archive.py'),
              (Join-Path $nativeRoot 'v6\dmformfactor-V6.m')
            )
            $sourceHashes = [ordered]@{}
            foreach ($file in $sourceFiles) {
              if (Test-Path $file -PathType Leaf) {
                $relative = $file.Substring($env:GITHUB_WORKSPACE.Length + 1)
                $sourceHashes[$relative] = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              }
            }

            $matrixFiles = @()
            foreach ($A in @(128,129,130,131,132,134,136)) {
              $matrixFiles += Join-Path $nativeRoot ("research\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
              $matrixFiles += Join-Path $p3Root ("research\afh_default_density_natural_xenon_halo\results\full_afh_v6_default_7_isotope_response\density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
            }
            $matrixFiles += Join-Path $nativeRoot 'research\afh_default_density_xe131\output\phi_response_native\afh_default_xe131_M_PhiPP_native.csv'
            $inputHashes = [ordered]@{}
            foreach ($file in $matrixFiles + @((Join-Path $nativeRoot 'v6\dmformfactor-V6.m'))) {
              if (Test-Path $file -PathType Leaf) {
                $relative = $file.Substring($env:GITHUB_WORKSPACE.Length + 1)
                $inputHashes[$relative] = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              }
            }

            $os = Get-CimInstance Win32_OperatingSystem
            $computer = Get-CimInstance Win32_ComputerSystem
            $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
            $gpus = @(Get-CimInstance Win32_VideoController | ForEach-Object {
              [ordered]@{ name = $_.Name; driver_version = $_.DriverVersion }
            })
            $pythonPackages = $null
            $pythonExe = Join-Path (Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv') 'Scripts\python.exe'
            if (Test-Path $pythonExe) {
              $packageJson = & $pythonExe -c "import importlib.metadata as m, json; print(json.dumps({n:m.version(n) for n in ('numpy','scipy','sympy')}))"
              if ($LASTEXITCODE -eq 0) { $pythonPackages = $packageJson | ConvertFrom-Json }
            }

            $manifest = [ordered]@{
              repository = 'lm846802297-bit/LZ-3-body-for-hdm'
              source_commit = $env:NATIVE_SOURCE_SHA
              p3_source_commit = $env:P3_SOURCE_SHA
              control_run_id = $env:GITHUB_RUN_ID
              control_run_attempt = $env:GITHUB_RUN_ATTEMPT
              native_package = 'AFH DMFormFactor v6.0'
              wolfram_version = $wolframVersionValue
              python_version = $pythonVersionValue
              python_packages = $pythonPackages
              runner_environment = [ordered]@{
                os_caption = $os.Caption
                os_version = $os.Version
                architecture = $env:PROCESSOR_ARCHITECTURE
                powershell_version = $PSVersionTable.PSVersion.ToString()
              }
              hardware = [ordered]@{
                cpu_model = $cpu.Name
                logical_processors = $computer.NumberOfLogicalProcessors
                physical_memory_bytes = [int64]$computer.TotalPhysicalMemory
                gpus = $gpus
              }
              source_sha256 = $sourceHashes
              input_sha256 = $inputHashes
              isotopes = @(128,129,130,131,132,134,136)
              response_indices = [ordered]@{ M=1; SigmaDoublePrime=2; SigmaPrime=3; PhiPP=4; PhiTildePrime=5; Delta=6; MPhiPP=7; SigmaPrimeDelta=8 }
              q_grid = [ordered]@{ points=2401; q_min_GeV=0.0; q_max_GeV=0.6; step_GeV=0.00025 }
              convention = 'raw AFH isoscalar tau1=tau2=0; physical equal-p/n factor four applied only to converted columns'
              comparison = $comparison
              native_xe131_dense_charge_dip = [ordered]@{
                csv_sha256 = $denseCsvHash
                metadata_sha256 = $denseMetaHash
                validation_sha256 = $denseValidationHash
                rows = $denseRows
                validation_status = if ($denseValidation) { $denseValidation.status } else { $null }
                q_min_GeV = 0.2545
                q_max_GeV = 0.2575
                q_step_GeV = 0.000025
                response_indices = [ordered]@{ M=1; PhiPP=4; MPhiPP=7 }
                common_coarse_nodes_compared = if ($denseValidation) { $denseValidation.common_nodes_compared } else { $null }
              }
              native_spatial_multipoles = [ordered]@{
                csv_sha256 = $spatialCsvHash
                metadata_sha256 = $spatialMetaHash
                rows = $spatialRows
                max_imaginary_residual = $spatialImaginaryResidual
                rank_map = $spatialRankMap
                isotope_set = @(129,131)
                channels = @('DeltaJ','SigmaPJ')
              }
              scope = 'native AFH total-response and rank-resolved spatial-multipole pointwise export; no finite-t nucleon form factors and no three-body L_mu_nu W_A_mu_nu contraction'
            }
            $manifest | ConvertTo-Json -Depth 32 | Set-Content -Path (Join-Path $out 'run_manifest.json') -Encoding UTF8
          }

      - name: Download the P3-B spatial response and rank-resolved multipole artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ github.event.inputs.p3_artifact_id || '14724884350' }}
          github-token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          repository: lm846802297-bit/LZ-3-body-for-hdm
          run-id: ${{ github.event.inputs.p3_run_id || '44950264673' }}
          path: ${{ runner.temp }}/afh-eight-response/p3-spatial

      - name: Validate P3-B spatial archive hashes, rank sums, and density-matrix inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $p3Dir = Join-Path $out 'p3-spatial'
          $p3MatchStudy = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\three_body_full_current_nucleon_match'
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE 'native-source'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $validationPath = Join-Path $out 'p3-spatial-archive-validation.json'
          & $pythonExe -m py_compile (Join-Path $p3MatchStudy 'validate_afh_spatial_multipole_archive.py')
          if ($LASTEXITCODE -ne 0) { throw 'P3-B spatial archive validator compilation failed.' }
          & $pythonExe (Join-Path $p3MatchStudy 'validate_afh_spatial_multipole_archive.py') --out-dir $p3Dir --out-json $validationPath
          if ($LASTEXITCODE -ne 0) { throw 'P3-B spatial archive hash/rank-sum validation failed.' }

          $metadata = Get-Content -Raw (Join-Path $p3Dir 'metadata.json') | ConvertFrom-Json
          if ($metadata.source_file_sha256 -ne 'dc0742f1c50b0a478adab62f2ddef6c82978ee034c1f177e0ed917deab5dd372') {
            throw 'P3-B AFH source hash does not match the pinned AFH v6.0 package.'
          }
          $p3Root = Join-Path $env:GITHUB_WORKSPACE 'p3-source'
          foreach ($entry in $metadata.isotope_metadata) {
            $A = [int]$entry.A
            $nativeMatrixPath = Join-Path $nativeRoot ("research\afh_default_density_natural_xenon_halo\input\afh_default_density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
            $p3MatrixPath = Join-Path $p3Root ("research\afh_default_density_natural_xenon_halo\results\full_afh_v6_default_7_isotope_response\density_matrices\afh_default_xe{0}_density_matrix.csv" -f $A)
            $nativeMatrixHash = (Get-FileHash $nativeMatrixPath -Algorithm SHA256).Hash.ToLower()
            $p3MatrixHash = (Get-FileHash $p3MatrixPath -Algorithm SHA256).Hash.ToLower()
            if ($nativeMatrixHash -ne $entry.matrix_sha256 -or $p3MatrixHash -ne $entry.matrix_sha256) {
              throw "P3/native AFH density-matrix hash mismatch for Xe-$A."
            }
          }
          $validation = Get-Content -Raw $validationPath | ConvertFrom-Json
          if ($validation.status -ne 'PASS_AFH_SPATIAL_MULTIPOLE_ARCHIVE' -or $validation.native_afh_validated -ne $false) {
            throw 'P3-B source-translated archive integrity gate did not pass with provisional status preserved.'
          }

      - name: Compile and test native P3 spatial comparators
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $p3Crosscheck = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\afh_response_crosschecks'
          $p3MatchStudy = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\three_body_full_current_nucleon_match'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe -m py_compile (Join-Path $p3Crosscheck 'compare_p3_spatial_vs_native.py') (Join-Path $p3Crosscheck 'compare_p3_multipoles_vs_native.py') (Join-Path $p3MatchStudy 'test_afh_native_multipole_comparator.py')
          if ($LASTEXITCODE -ne 0) { throw 'P3 native AFH comparator compilation failed.' }
          & $pythonExe -m unittest discover -s $p3MatchStudy -p 'test_afh_native_multipole_comparator.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'P3 native multipole comparator regression tests failed.' }

      - name: Compare P3-B total spatial responses with native AFH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $p3Crosscheck = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\afh_response_crosschecks'
          $p3Dir = Join-Path $out 'p3-spatial'
          $nativeDir = Join-Path $out 'native'
          $manifestPath = Join-Path $out 'run_manifest.json'
          $resultPath = Join-Path $out 'p3-native-spatial-response-comparison.json'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe (Join-Path $p3Crosscheck 'compare_p3_spatial_vs_native.py') --p3-csv (Join-Path $p3Dir 'afh_spatial_obdme_responses_7isotope_2401.csv') --p3-metadata (Join-Path $p3Dir 'metadata.json') --native-dir $nativeDir --native-metadata (Join-Path $nativeDir 'native_metadata.txt') --native-manifest $manifestPath --out-json $resultPath
          if ($LASTEXITCODE -ne 0) { throw 'P3-B native AFH total-response comparison failed.' }

      - name: Compare P3-B rank-resolved spatial amplitudes with native AFH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $p3Crosscheck = Join-Path $env:GITHUB_WORKSPACE 'p3-source\research\afh_response_crosschecks'
          $p3Dir = Join-Path $out 'p3-spatial'
          $nativeSpatialDir = Join-Path $out 'native-spatial-multipoles'
          $manifestPath = Join-Path $out 'run_manifest.json'
          $resultPath = Join-Path $out 'p3-native-spatial-multipole-comparison.json'
          $venv = Join-Path $env:RUNNER_TEMP 'afh-eight-response-python-venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe (Join-Path $p3Crosscheck 'compare_p3_multipoles_vs_native.py') --p3-multipole-csv (Join-Path $p3Dir 'afh_spatial_obdme_multipoles_7isotope_2401.csv') --p3-metadata (Join-Path $p3Dir 'metadata.json') --native-multipole-csv (Join-Path $nativeSpatialDir 'afh_v6_xe129_xe131_spatial_multipoles_native.csv') --native-metadata (Join-Path $nativeSpatialDir 'native_spatial_multipole_metadata.txt') --native-manifest $manifestPath --out-json $resultPath
          if ($LASTEXITCODE -ne 0) { throw 'P3-B native AFH rank-resolved multipole comparison failed.' }

      - name: Attach P3 response, multipole, and artifact provenance
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          $manifestPath = Join-Path $out 'run_manifest.json'
          $responsePath = Join-Path $out 'p3-native-spatial-response-comparison.json'
          $multipolePath = Join-Path $out 'p3-native-spatial-multipole-comparison.json'
          $p3Dir = Join-Path $out 'p3-spatial'
          if (Test-Path $manifestPath) {
            $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
            if (Test-Path $responsePath) {
              $responseComparison = Get-Content -Raw $responsePath | ConvertFrom-Json
              $manifest | Add-Member -NotePropertyName p3_spatial_response_crosscheck -NotePropertyValue $responseComparison -Force
            }
            if (Test-Path $multipolePath) {
              $multipoleComparison = Get-Content -Raw $multipolePath | ConvertFrom-Json
              $manifest | Add-Member -NotePropertyName p3_spatial_multipole_crosscheck -NotePropertyValue $multipoleComparison -Force
            }
            $p3ArtifactFiles = [ordered]@{}
            foreach ($name in @('metadata.json','afh_spatial_obdme_responses_7isotope_2401.csv','afh_spatial_obdme_multipoles_7isotope_2401.csv')) {
              $file = Join-Path $p3Dir $name
              if (Test-Path $file -PathType Leaf) {
                $p3ArtifactFiles[$name] = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              }
            }
            $manifest | Add-Member -NotePropertyName p3_artifact_provenance -NotePropertyValue ([ordered]@{
              repository = 'lm846802297-bit/LZ-3-body-for-hdm'
              run_id = '${{ github.event.inputs.p3_run_id || '44950264673' }}'
              artifact_id = '${{ github.event.inputs.p3_artifact_id || '14724884350' }}'
              source_commit = $env:P3_SOURCE_SHA
              file_sha256 = $p3ArtifactFiles
            }) -Force
            $manifest | ConvertTo-Json -Depth 32 | Set-Content -Path $manifestPath -Encoding UTF8
          }

      - name: Hash native, Python and comparison outputs
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'afh-eight-response'
          if (Test-Path $out) {
            $hashes = Get-ChildItem $out -File -Recurse |
              Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($out.Length + 1)
                $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                "$hash  $relative"
              }
            $hashes | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII
          }

      - name: Upload seven-isotope AFH eight-response archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afh-v6-seven-isotope-eight-response
          path: ${{ runner.temp }}/afh-eight-response/
          if-no-files-found: warn
          retention-days: 90
