name: Xe-131 native Mathematica full dSigma and Python comparison

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run a quick smoke test first, or the full 652-row grid"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

jobs:
  xe131-native-full-dsigma:
    runs-on: [self-hosted, Windows, X64, research-gpu]
    timeout-minutes: 360
    env:
      RUN_MODE: ${{ inputs.run_mode }}
    steps:
      - name: Check out the private control repository
        uses: actions/checkout@v4

      - name: Check out the reviewed LZ research revision
        uses: actions/checkout@v4
        with:
          repository: lm846802297-bit/LZ-3-body-for-hdm
          ref: 2b2c25ce9aa142b8f7a648b33a051e801ec76418
          token: ${{ secrets.LZ_RESEARCH_READ_TOKEN }}
          path: research
          persist-credentials: false

      - name: Verify pinned source and required native inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '2b2c25ce9aa142b8f7a648b33a051e801ec76418'
          $actual = (git -C "$env:GITHUB_WORKSPACE\research" rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Research source SHA mismatch: expected $expected, got $actual"
          }
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_default_density_xe131'
          $required = @(
            'run_native_full_dsigma_windows.ps1',
            'run_afh_eq6_full_dsigma.wls',
            'compare_full_dsigma_mathematica.py',
            'output\afh_default_xe131_WM00.csv',
            'output\native_exports\afh_default_xe131_WM00_mathematica.csv'
          )
          foreach ($relative in $required) {
            $path = Join-Path $study $relative
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required pinned research input is missing: $path"
            }
          }
          Write-Host "Verified research source commit $actual"
          Get-FileHash (Join-Path $study 'output\native_exports\afh_default_xe131_WM00_mathematica.csv') -Algorithm SHA256
          Get-FileHash (Join-Path $study 'output\afh_default_xe131_WM00.csv') -Algorithm SHA256

      - name: Verify Wolfram and prepare isolated Python environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wolfram = Get-Command wolframscript -ErrorAction Stop
          $wolframVersion = & $wolfram.Source -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'wolframscript -version failed.' }
          $python = Get-Command python -ErrorAction Stop
          $venv = Join-Path $env:RUNNER_TEMP 'lz-xe131-python-venv'
          & $python.Source -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated Python environment.' }
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          & $pythonExe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $pythonExe -m pip install -r "$env:GITHUB_WORKSPACE\research\research\afh_default_density_xe131\requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Research Python dependencies could not be installed.' }
          & $pythonExe -c 'import numpy, pandas, scipy; print("NumPy", numpy.__version__, "pandas", pandas.__version__, "SciPy", scipy.__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Required Python imports failed.' }
          $env:PATH = "$(Join-Path $venv 'Scripts');$env:PATH"
          $out = Join-Path $env:RUNNER_TEMP 'lz-xe131-full-dsigma'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @($wolframVersion) | Set-Content -Path (Join-Path $out 'wolfram-version.txt') -Encoding UTF8
          & $pythonExe --version 2>&1 | Set-Content -Path (Join-Path $out 'python-version.txt') -Encoding UTF8

      - name: Run native Mathematica and independent Python comparison
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'lz-xe131-python-venv'
          $env:PATH = "$(Join-Path $venv 'Scripts');$env:PATH"
          $out = Join-Path $env:RUNNER_TEMP 'lz-xe131-full-dsigma'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_default_density_xe131'
          $transcript = Join-Path $out 'native-full-dsigma-transcript.txt'
          Start-Transcript -Path $transcript -Force
          try {
            if ($env:RUN_MODE -eq 'smoke') {
              & (Join-Path $study 'run_native_full_dsigma_windows.ps1') -OutputDirectory $out -Benchmark 'green_ms300_dm1' -ERListKeV '200' -NW 8 -NZ 8 -NPhi 4 -RelativeTolerance 2e-7 -ResponseTolerance 2e-8 -RequireFullGrid:$false
            }
            elseif ($env:RUN_MODE -eq 'full') {
              & (Join-Path $study 'run_native_full_dsigma_windows.ps1') -OutputDirectory $out -NW 16 -NZ 16 -NPhi 8 -RelativeTolerance 2e-7 -ResponseTolerance 2e-8 -RequireFullGrid:$true
            }
            else {
              throw "Unknown run mode: $env:RUN_MODE"
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Native Mathematica/Python runner exited with code $LASTEXITCODE."
            }
          }
          finally {
            Stop-Transcript
          }

      - name: Validate full grid, factor-four ledger, and archive provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'lz-xe131-full-dsigma'
          $study = Join-Path $env:GITHUB_WORKSPACE 'research\research\afh_default_density_xe131'
          $comparisonPath = Join-Path $out 'mathematica_python_full_dsigma_comparison.json'
          $mathematicaPath = Join-Path $out 'mathematica_full_dsigma_xe131_metadata.json'
          $comparisonCsv = Join-Path $out 'mathematica_python_full_dsigma_comparison.csv'
          $mathematicaCsv = Join-Path $out 'mathematica_full_dsigma_xe131.csv'
          foreach ($path in @($comparisonPath, $mathematicaPath, $comparisonCsv, $mathematicaCsv)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing expected result: $path" }
          }
          $comparison = Get-Content -Raw $comparisonPath | ConvertFrom-Json
          $native = Get-Content -Raw $mathematicaPath | ConvertFrom-Json
          $comparisonRows = @(Import-Csv $comparisonCsv)
          $nativeRows = @(Import-Csv $mathematicaCsv)
          if ($comparison.status -ne 'PASS') { throw "Comparator status is $($comparison.status), not PASS." }
          $expectedRows = if ($env:RUN_MODE -eq 'smoke') { 4 } elseif ($env:RUN_MODE -eq 'full') { 652 } else { throw "Unknown run mode: $env:RUN_MODE" }
          if ($comparison.rows -ne $expectedRows -or $comparisonRows.Count -ne $expectedRows -or $nativeRows.Count -ne $expectedRows) {
            throw "Expected $expectedRows rows for mode $env:RUN_MODE; comparison metadata=$($comparison.rows), comparison CSV=$($comparisonRows.Count), Mathematica CSV=$($nativeRows.Count)."
          }
          if ($null -eq $native.AFH.max_full_grid_factor_four_relative_residual -or
              $native.AFH.max_full_grid_factor_four_relative_residual -gt 2e-12) {
            throw 'Mathematica full-grid factor-four ledger is missing or exceeds tolerance.'
          }
          if ($comparison.max_relative_differences.I6 -gt 2e-7 -or
              $comparison.max_relative_differences.dsigma -gt 2e-7 -or
              $comparison.max_relative_differences.R_A_physical -gt 2e-8 -or
              $comparison.max_relative_differences.factor4_mapping -gt 2e-12 -or
              $comparison.max_relative_differences.factor4_ratio -gt 2e-12) {
            throw 'One or more pointwise Mathematica/Python comparison tolerances failed.'
          }
          $nativeOpen = @($nativeRows | Where-Object { [int]$_.phase_space_open -eq 1 })
          $badNativeRatios = @($nativeOpen | Where-Object {
            [math]::Abs([double]$_.dsigma_factor4_ratio - 4.0) -gt 8e-12
          })
          if ($badNativeRatios.Count -gt 0) {
            throw 'One or more native Mathematica rows do not carry the factor four exactly once.'
          }
          $expected = '2b2c25ce9aa142b8f7a648b33a051e801ec76418'
          $actual = (git -C "$env:GITHUB_WORKSPACE\research" rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw 'Pinned research checkout changed during execution.' }
          $wolframVersion = (Get-Content -Raw (Join-Path $out 'wolfram-version.txt')).Trim()
          $pythonVersion = (Get-Content -Raw (Join-Path $out 'python-version.txt')).Trim()
          if ($env:RUN_MODE -eq 'smoke') {
            $gridLabel = '101, 200, 267, 542 keV anchors; green benchmark only'
            $runNW = 8
            $runNZ = 8
            $runNPhi = 4
          }
          else {
            $gridLabel = '5:5:800 plus explicit 101, 200, 267, 542 keV anchors'
            $runNW = 16
            $runNZ = 16
            $runNPhi = 8
          }
          $manifest = [ordered]@{
            status = 'PASS'
            repository = 'lm846802297-bit/LZ-3-body-for-hdm'
            source_commit = $actual
            control_run_id = $env:GITHUB_RUN_ID
            control_run_attempt = $env:GITHUB_RUN_ATTEMPT
            wolfram_version = $wolframVersion
            python_version = $pythonVersion
            calculation = [ordered]@{
              run_mode = $env:RUN_MODE
              recoil_grid_keV = $gridLabel
              expected_rows = $expectedRows
              nW = $runNW
              nz = $runNZ
              nphi = $runNPhi
              width_scheme = 'pole'
              W2_mapping = 'threshold_u2'
              comparison_rtol_I6_dsigma = 2e-7
              comparison_rtol_AFH_response = 2e-8
              exact_factor4_tolerance = 2e-12
            }
            comparison = $comparison
            native_metadata = $native
            code_sha256 = [ordered]@{
              Wolfram_runner = (Get-FileHash (Join-Path $study 'run_afh_eq6_full_dsigma.wls') -Algorithm SHA256).Hash.ToLower()
              PowerShell_wrapper = (Get-FileHash (Join-Path $study 'run_native_full_dsigma_windows.ps1') -Algorithm SHA256).Hash.ToLower()
              Python_comparator = (Get-FileHash (Join-Path $study 'compare_full_dsigma_mathematica.py') -Algorithm SHA256).Hash.ToLower()
              Python_phase_space = (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'research\research\figure2_full_reproduction\phase_space_convergence.py') -Algorithm SHA256).Hash.ToLower()
              Python_eq6_kernel = (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'research\research\figure2_full_reproduction\eq6_kernel.py') -Algorithm SHA256).Hash.ToLower()
              Python_requirements = (Get-FileHash (Join-Path $study 'requirements.txt') -Algorithm SHA256).Hash.ToLower()
            }
            input_sha256 = [ordered]@{
              python_AFH_response = (Get-FileHash (Join-Path $study 'output\afh_default_xe131_WM00.csv') -Algorithm SHA256).Hash.ToLower()
              native_Mathematica_AFH_response = (Get-FileHash (Join-Path $study 'output\native_exports\afh_default_xe131_WM00_mathematica.csv') -Algorithm SHA256).Hash.ToLower()
            }
          }
          $manifest | ConvertTo-Json -Depth 12 | Set-Content -Path (Join-Path $out 'run_manifest.json') -Encoding UTF8
          $hashLines = Get-ChildItem $out -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $hashLines | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII
          Write-Host "PASS: $($comparison.rows) pointwise rows."
          Write-Host "Max I6 relative difference: $($comparison.max_relative_differences.I6)"
          Write-Host "Max dSigma relative difference: $($comparison.max_relative_differences.dsigma)"
          Write-Host "Max factor-four mapping residual: $($comparison.max_relative_differences.factor4_mapping)"
          Write-Host "Max factor-four ratio residual: $($comparison.max_relative_differences.factor4_ratio)"

      - name: Upload native Mathematica and Python comparison archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xe131-native-mathematica-${{ inputs.run_mode }}
          path: ${{ runner.temp }}/lz-xe131-full-dsigma/
          if-no-files-found: warn
          retention-days: 90
